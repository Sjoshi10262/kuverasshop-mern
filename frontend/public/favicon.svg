  <polygon points="80,112 110,64 50,64" fill="none" stroke="#E7C982" stroke-width="2.5" />
  <polygon points="80,56 102,90 58,90" fill="none" stroke="#E7C982" stroke-width="2" />
  <polygon points="80,104 102,70 58,70" fill="none" stroke="#E7C982" stroke-width="2" />
  
  <!-- Central Lotus & Bindu -->
  <circle cx="80" cy="80" r="12" fill="#E5A853" stroke="#FFFDF8" stroke-width="1.5" />
  <circle cx="80" cy="80" r="4.5" fill="#7A1010" />
